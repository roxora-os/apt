# shellcheck shell=bash disable=SC2034
# Roxora's apt repository, served by GitHub Pages from this repository.

# Where the repository is served; images and the documentation use this URL.
REPO_URL=https://roxora-os.github.io/apt

# Origin and Label of every Release file. Roxora's apt pin matches on the
# host the repository is served from, not on these fields.
REPO_ORIGIN=Roxora
REPO_LABEL=Roxora

# The Release files are valid this many days from the run that signed them
# (Valid-Until). The workflow signs them again on every run, hourly, so
# they expire only when publishing stops; apt then refuses the repository
# (see README.md).
REPO_VALID_DAYS=10

# One suite per Ubuntu release, named after it. Each has one component,
# main: the packages for installed systems (see README.md for betas).
REPO_SUITES="noble resolute"
REPO_COMPONENT=main
REPO_ARCHITECTURES=arm64

# The signing key. Its public part is keys/roxora-archive-keyring.asc; the
# secret key is only in the APT_SIGNING_KEY secret of this repository.
REPO_KEY_FINGERPRINT=07353CCFAF21725418E3CE4798FC2BE6A9A8952D

# hwtool: every release of roxora-os/hwtool from this version on that is
# not a draft or a pre-release, its two arm64 packages, each checked against
# the SHA-256 digest GitHub reports for the release file.
HWTOOL_REPO=roxora-os/hwtool
HWTOOL_MIN_VERSION=0.3.0

# The release packages (roxora-release and the flavor packages): built from
# every release of roxora-os/build that is not a draft or a pre-release and
# has userpatches/roxora/packages/build.sh, with that script, at its tag.
BUILD_REPO=roxora-os/build
